services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - LIFTY_DB=/data/lifty.db
      # Uncomment and set to enable instance-level auth (all API routes require a JWT):
      # - LIFTY_PASSWORD=your-password-here

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
