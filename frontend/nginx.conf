server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache the HTML entry point so iOS PWA always fetches the latest shell
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri /index.html;
  }

  # Service worker must never be cached — browser needs to re-fetch it to detect updates
  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  # Hashed assets (JS/CSS) — cache forever, cache-busting is in the filename
  location ~* \.(js|css|woff2?|png|svg|ico|webmanifest)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
